<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <h1>Library Desk</h1>
      <p class="muted">Catalogue, issue and return books</p>
    </div>
  </header>

  <main class="wrap">
    <section class="stats" id="stats" aria-label="Library summary"></section>

    <nav class="tabs" role="tablist">
      <button class="tab active" role="tab" data-tab="books" aria-selected="true">Books</button>
      <button class="tab" role="tab" data-tab="members" aria-selected="false">Members</button>
      <button class="tab" role="tab" data-tab="history" aria-selected="false">Issue history</button>
    </nav>

    <!-- BOOKS -->
    <section id="tab-books" class="panel">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search by title, author or ISBN" aria-label="Search books">
        <select id="filter-status" aria-label="Filter by status">
          <option value="">All books</option>
          <option value="Available">Available</option>
          <option value="Issued">Issued</option>
        </select>
        <select id="filter-category" aria-label="Filter by category">
          <option value="">All categories</option>
        </select>
        <button class="btn primary" id="btn-add-book">Add book</button>
      </div>
      <ul id="book-list" class="books" aria-live="polite"></ul>
    </section>

    <!-- MEMBERS -->
    <section id="tab-members" class="panel" hidden>
      <div class="toolbar">
        <p class="muted grow">Members can hold up to 3 books at a time.</p>
        <button class="btn primary" id="btn-add-member">Add member</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th><th>Books held</th></tr></thead>
          <tbody id="member-rows"></tbody>
        </table>
      </div>
    </section>

    <!-- HISTORY -->
    <section id="tab-history" class="panel" hidden>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Book</th><th>Member</th><th>Issued</th><th>Due</th><th>Returned</th><th>Fine</th></tr></thead>
          <tbody id="history-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Add book -->
  <dialog id="dlg-book">
    <form method="dialog" id="form-book" novalidate>
      <h2>Add a book</h2>
      <label>Title <input name="title" required maxlength="150"></label>
      <label>Author <input name="author" required maxlength="150"></label>
      <label>ISBN <input name="isbn" required placeholder="10 or 13 digits" inputmode="numeric"></label>
      <label>Category
        <input name="category" list="category-options" placeholder="e.g. Fiction" maxlength="50">
        <datalist id="category-options"></datalist>
      </label>
      <p class="form-error" role="alert"></p>
      <div class="actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save book</button>
      </div>
    </form>
  </dialog>

  <!-- Add member -->
  <dialog id="dlg-member">
    <form method="dialog" id="form-member" novalidate>
      <h2>Add a member</h2>
      <label>Full name <input name="name" required maxlength="100"></label>
      <label>Email <input name="email" type="email" required></label>
      <label>Phone <input name="phone" inputmode="tel" placeholder="Optional"></label>
      <p class="form-error" role="alert"></p>
      <div class="actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save member</button>
      </div>
    </form>
  </dialog>

  <!-- Issue book -->
  <dialog id="dlg-issue">
    <form method="dialog" id="form-issue" novalidate>
      <h2>Issue book</h2>
      <p id="issue-title" class="muted"></p>
      <label>Member <select name="member_id" id="issue-member" required></select></label>
      <p class="form-error" role="alert"></p>
      <div class="actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Issue book</button>
      </div>
    </form>
  </dialog>

  <!-- Delete confirm -->
  <dialog id="dlg-delete">
    <form method="dialog" id="form-delete">
      <h2>Delete book?</h2>
      <p id="delete-title"></p>
      <p class="muted">This also removes its issue history.</p>
      <div class="actions">
        <button type="button" class="btn" data-close>Keep book</button>
        <button type="submit" class="btn danger">Delete book</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
